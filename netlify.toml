[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed build output never changes under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Catalog and vendor DB: short HTTP cache so the service worker's background refresh sees updates.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The page also carries a CSP <meta> (index.html); frame-ancestors only works as a header.
# Referrer: OpenStreetMap's tile servers refuse requests without a Referer ("Access blocked:
# Referer is required"), so send the origin only (never the path) to other sites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "bluetooth=(self), geolocation=(self), camera=(), microphone=()"
