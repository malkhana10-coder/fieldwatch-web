<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0d" />
  <meta name="description" content="Fieldwatch Web — unofficial bilingual (Arabic / English) web port of the passive Wi-Fi & Bluetooth LE field watcher." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Fieldwatch Web</title>
  <script>
    // Apply saved theme/lang before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('fw.settings') || '{}');
      var th = s.theme || 'system';
      if (th === 'system') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = th;
      var lang = s.lang || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <style>html,body{background:#0a0f0d}html[data-theme=light],html[data-theme=light] body{background:#f4f6f5}html[data-theme=night],html[data-theme=night] body{background:#000}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
