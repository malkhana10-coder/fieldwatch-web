apply plugin: 'com.android.application'

// versionName comes from package.json, the same source as the web app and the APK file name.
def appPackage = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))

// versionCode must only ever grow, or Android refuses the update. CI builds use
// 100 + the workflow run number (builds 1-3 used the bare run number); local builds get 100.
def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def appVersionCode = 100 + (ciRunNumber ? ciRunNumber.toInteger() : 0)

// Release signing. If KEYSTORE_FILE is set (the workflow decodes the KEYSTORE_BASE64
// secret into it), the key and passwords come from the environment. Otherwise the
// committed sideload key is used, so every build installs over the previous one.
// That key is public; see android/README.md before distributing the app more widely.
def envKeystore = System.getenv('KEYSTORE_FILE')
def envStorePassword = System.getenv('KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('KEY_ALIAS')
def envKeyPassword = System.getenv('KEY_PASSWORD')
if (envKeystore && (!envStorePassword || !envKeyAlias)) {
    throw new GradleException('KEYSTORE_FILE is set, so KEYSTORE_PASSWORD and KEY_ALIAS must be set too.')
}

android {
    namespace = "io.github.malkhana10.fieldwatch"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.malkhana10.fieldwatch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (envKeystore) {
                storeFile = file(envKeystore)
                storePassword = envStorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword ?: envStorePassword
            } else {
                storeFile = file('fieldwatch-sideload.keystore')
                storePassword = 'fieldwatch-sideload'
                keyAlias = 'fieldwatch'
                keyPassword = 'fieldwatch-sideload'
            }
        }
    }
    buildTypes {
        release {
            // Not debuggable, so Capacitor also leaves WebView remote debugging off.
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
