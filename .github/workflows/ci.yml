name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser smoke test (Arabic + English, light + dark)
        run: |
          npx playwright@1.56.1 install --with-deps chromium
          node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e-shots/
          if-no-files-found: ignore

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fieldwatch-Web-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fieldwatch-Web-debug-apk
          path: Fieldwatch-Web-debug.apk
      - name: Publish preview release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview Fieldwatch-Web-debug.apk \
            --prerelease --title "Android preview (debug build)" \
            --notes "Automatic debug build of ${GITHUB_SHA::7}. Unsigned for the Play Store; install by sideloading."
