# Builds the Android app (Capacitor wrapper around the web build) and publishes
# the APK on a GitHub pre-release so it can be downloaded straight to a phone.
#
# The APK is a release build signed with ONE stable key, so each build installs over
# the previous one and keeps the app's data. By default that is the public sideload
# key committed in android/app/ (see android/README.md). To sign with a private key
# instead, set the repository secrets KEYSTORE_BASE64 (base64 of the keystore file),
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (optional; defaults to KEYSTORE_PASSWORD).
name: Android APK

on:
  push:
    branches: [main, fix/v1.2-review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web app and sync into Android
        run: |
          npm run build
          npx cap sync android

      - name: Choose the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the keystore from the KEYSTORE_BASE64 secret."
          else
            echo "No KEYSTORE_BASE64 secret: signing with the committed sideload key (android/app/fieldwatch-sideload.keystore)."
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          v=$(node -p "require('./package.json').version")
          out="fieldwatch-${v}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fieldwatch-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Fieldwatch ${{ steps.apk.outputs.version }} (Android build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: ${{ steps.apk.outputs.file }}
          body: |
            Release APK of Fieldwatch Web ${{ steps.apk.outputs.version }} for sideloading.
            Unofficial port of Fieldwatch by Off Grid Pete LLC (MIT).
            Built from ${{ github.sha }}. APK SHA-256: `${{ steps.apk.outputs.sha256 }}`

            Updating: every build from now on is signed with the same key, so it installs over the previous one and keeps your data.
            Android builds 1-3 were signed with throwaway debug keys. If one of those is installed, Android refuses this update:
            uninstall it first. That deletes its data, and exports did not work in those builds, so their data cannot be carried over.
